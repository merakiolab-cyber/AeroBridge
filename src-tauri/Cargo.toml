[package]
name = "aerobridge-studio"
version = "2.8.0"
description = "Ultra-Fast Creative Asset Manager for Windows 11"
authors = ["AeroBridge Contributors"]
license = "MIT"
repository = "https://github.com/merakiolab-cyber/AeroBridge"
edition = "2021"
rust-version = "1.77"

[lib]
name = "aerobridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4" }
tauri-plugin-log = "2"
